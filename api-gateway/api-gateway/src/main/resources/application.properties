spring.application.name=api-gateway
server.port=8765

# =========================
# EUREKA
# =========================
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.instance.prefer-ip-address=true

# =========================
# JWT
# =========================
jwt.secret=${JWT_SECRET}

# =========================
# AUTH SERVICE
# =========================
spring.cloud.gateway.server.webmvc.routes[0].id=auth-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/auth-service/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0]=StripPrefix=1

# =========================
# QUESTION SERVICE
# =========================
spring.cloud.gateway.server.webmvc.routes[1].id=question-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://QUESTION-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/question-service/**
spring.cloud.gateway.server.webmvc.routes[1].filters[0]=StripPrefix=1

# =========================
# QUIZ SERVICE
# =========================
spring.cloud.gateway.server.webmvc.routes[2].id=quiz-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://QUIZ-SERVICE
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/quiz-service/**
spring.cloud.gateway.server.webmvc.routes[2].filters[0]=StripPrefix=1