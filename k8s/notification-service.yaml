apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: quiz-app

spec:
  replicas: 1

  selector:
    matchLabels:
      app: notification-service

  template:
    metadata:
      labels:
        app: notification-service

    spec:
      containers:
        - name: notification-service
          image: notification-service:k8s
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8091

          env:
            - name: RABBITMQ_HOST
              value: rabbitmq

            - name: RABBITMQ_PORT
              value: "5672"

            - name: RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: microservices-secrets
                  key: rabbitmq-user

            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: microservices-secrets
                  key: rabbitmq-password