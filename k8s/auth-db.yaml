apiVersion: v1
kind: Service
metadata:
  name: auth-db
  namespace: quiz-app

spec:
  selector:
    app: auth-db

  ports:
    - port: 3306
      targetPort: 3306

---

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: auth-db
  namespace: quiz-app

spec:
  serviceName: auth-db
  replicas: 1

  selector:
    matchLabels:
      app: auth-db

  template:
    metadata:
      labels:
        app: auth-db

    spec:
      containers:
        - name: auth-db
          image: mysql:8.0

          ports:
            - containerPort: 3306

          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: microservices-secrets
                  key: db-password

            - name: MYSQL_DATABASE
              value: authdb

          volumeMounts:
            - name: auth-db-storage
              mountPath: /var/lib/mysql

  volumeClaimTemplates:
    - metadata:
        name: auth-db-storage

      spec:
        accessModes:
          - ReadWriteOnce

        resources:
          requests:
            storage: 2Gi