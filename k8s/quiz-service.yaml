apiVersion: apps/v1
kind: Deployment
metadata:
  name: quiz-service
  namespace: quiz-app

spec:
  replicas: 1

  selector:
    matchLabels:
      app: quiz-service

  template:
    metadata:
      labels:
        app: quiz-service

    spec:
      containers:
        - name: quiz-service
          image: quiz-service:k8s
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8090

          env:
            - name: DB_HOST
              value: quiz-db

            - name: DB_PORT
              value: "3306"

            - name: DB_USERNAME
              value: root

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: microservices-secrets
                  key: db-password

            - name: QUESTION_SERVICE_URL
              value: "http://question-service:8080"

            - name: RABBITMQ_HOST
              value: rabbitmq

            - name: RABBITMQ_PORT
              value: "5672"

            - name: RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: microservices-secrets
                  key: rabbitmq-user

            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: microservices-secrets
                  key: rabbitmq-password

---

apiVersion: v1
kind: Service
metadata:
  name: quiz-service
  namespace: quiz-app

spec:
  selector:
    app: quiz-service

  ports:
    - port: 8090
      targetPort: 8090

  type: ClusterIP