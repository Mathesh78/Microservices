apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: quiz-app

spec:
  replicas: 1

  selector:
    matchLabels:
      app: auth-service

  template:
    metadata:
      labels:
        app: auth-service

    spec:
      containers:
        - name: auth-service
          image: auth-service:k8s
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8082

          env:
            - name: DB_HOST
              value: auth-db

            - name: DB_PORT
              value: "3306"

            - name: DB_USERNAME
              value: root

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: microservices-secrets
                  key: db-password

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: jwt-secret

---

apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: quiz-app

spec:
  selector:
    app: auth-service

  ports:
    - port: 8082
      targetPort: 8082

  type: ClusterIP