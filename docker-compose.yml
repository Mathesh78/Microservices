services:

  service-registry:
    build:
      context: ./service-registry/service-registry
    container_name: service-registry
    ports:
      - "8761:8761"
    networks:
      - microservices-net
    restart: unless-stopped


  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - microservices-net
    restart: unless-stopped


  question-db:
    image: mysql:8.0
    container_name: question-db
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: questiondb
    volumes:
      - question-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - microservices-net
    restart: unless-stopped


  quiz-db:
    image: mysql:8.0
    container_name: quiz-db
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: quizdb
    volumes:
      - quiz-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - microservices-net
    restart: unless-stopped


  auth-db:
    image: mysql:8.0
    container_name: auth-db
    ports:
      - "3309:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: authdb
    volumes:
      - auth-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - microservices-net
    restart: unless-stopped


  question-service:
    build:
      context: ./question-service/question-service
    container_name: question-service
    ports:
      - "8081:8080"
    environment:
      DB_HOST: question-db
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}
      EUREKA_URL: http://service-registry:8761/eureka/
    depends_on:
      question-db:
        condition: service_healthy
      service-registry:
        condition: service_started
    networks:
      - microservices-net
    restart: unless-stopped


  quiz-service:
    build:
      context: ./quiz-service/quiz-service
    container_name: quiz-service
    ports:
      - "8090:8090"
    environment:
      DB_HOST: quiz-db
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}

      EUREKA_URL: http://service-registry:8761/eureka/

      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    depends_on:
      quiz-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      service-registry:
        condition: service_started
      question-service:
        condition: service_started
    networks:
      - microservices-net
    restart: unless-stopped


  notification-service:
    build:
      context: ./notification-service/notification-service
    container_name: notification-service
    ports:
      - "8091:8091"
    environment:
      EUREKA_URL: http://service-registry:8761/eureka/

      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    depends_on:
      rabbitmq:
        condition: service_healthy
      service-registry:
        condition: service_started
    networks:
      - microservices-net
    restart: unless-stopped


  auth-service:
    build:
      context: ./auth-service/auth-service
    container_name: auth-service
    ports:
      - "8082:8082"
    environment:
      DB_HOST: auth-db
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}

      EUREKA_URL: http://service-registry:8761/eureka/

      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      auth-db:
        condition: service_healthy
      service-registry:
        condition: service_started
    networks:
      - microservices-net
    restart: unless-stopped


  api-gateway:
    build:
      context: ./api-gateway/api-gateway
    container_name: api-gateway
    ports:
      - "8765:8765"
    environment:
      EUREKA_URL: http://service-registry:8761/eureka/
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - service-registry
      - auth-service
      - question-service
      - quiz-service
    networks:
      - microservices-net
    restart: unless-stopped


networks:
  microservices-net:
    external: true


volumes:
  question-db-data:
    external: true

  quiz-db-data:
    external: true

  auth-db-data:
    external: true